<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Slope Surfer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0620;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    color: #eafcff;
    text-align: center;
    z-index: 10;
  }
  .hidden { display: none !important; }
  .title {
    font-size: clamp(2.2rem, 9vw, 3.6rem);
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #4de8ff, #a06bff, #ff5fb0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(120, 100, 255, 0.5);
  }
  .subtitle {
    color: #9aa3d0;
    font-size: 0.95rem;
    letter-spacing: 1px;
    max-width: 340px;
    line-height: 1.5;
  }
  button {
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 1px;
    color: #0a0620;
    background: linear-gradient(90deg, #4de8ff, #8f6bff);
    border: none;
    border-radius: 999px;
    padding: 14px 42px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(90, 150, 255, 0.5);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button:active { transform: scale(0.95); }
  button.secondary {
    background: transparent;
    color: #cfe6ff;
    border: 2px solid #4de8ff88;
    box-shadow: none;
    padding: 12px 40px;
  }
  .menu-buttons { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
  .toggle-row {
    display: flex; align-items: center; gap: 10px;
    color: #9aa3d0; font-size: 0.9rem;
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: env(safe-area-inset-top, 14px) 18px 0 18px;
    color: #eafcff;
    z-index: 5;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  .hud-box {
    background: rgba(15, 10, 40, 0.55);
    border: 1px solid rgba(120, 180, 255, 0.25);
    border-radius: 10px;
    padding: 6px 14px;
    font-size: 0.95rem;
    letter-spacing: 0.5px;
    backdrop-filter: blur(4px);
  }
  .hud-box b { color: #4de8ff; }
  .state-badge {
    position: absolute;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 1px;
    z-index: 5;
    border: 1px solid transparent;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .stat-line { display: flex; gap: 22px; margin: 4px 0 10px; font-size: 1rem; }
  .stat-line span b { color: #4de8ff; }
  #muteBtn {
    pointer-events: auto;
    background: rgba(15, 10, 40, 0.55);
    border: 1px solid rgba(120, 180, 255, 0.25);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 1rem;
    box-shadow: none;
    color: #eafcff;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="hud" class="hidden">
  <div class="hud-box">DIST <b id="hudDistance">0</b>m</div>
  <div class="hud-box">SCORE <b id="hudScore">0</b></div>
</div>
<div id="stateBadge" class="state-badge hidden">GLIDE</div>

<div id="menuScreen" class="screen">
  <div class="title">SLOPE SURFER</div>
  <div class="subtitle">One button. HOLD to dive — heavy gravity, digs into hills, builds huge speed. RELEASE to glide — light gravity, soars for miles.</div>
  <div class="menu-buttons">
    <button id="playBtn">PLAY</button>
    <button id="soundToggleBtn" class="secondary">SOUND: ON</button>
  </div>
  <div class="subtitle" style="margin-top:6px;">HOLD = DIVE &nbsp;·&nbsp; RELEASE = GLIDE</div>
</div>

<div id="gameOverScreen" class="screen hidden">
  <div class="title" style="font-size: clamp(1.8rem, 7vw, 2.6rem);">RUN OVER</div>
  <div class="stat-line">
    <span>SCORE<br><b id="finalScore">0</b></span>
    <span>BEST<br><b id="bestScore">0</b></span>
  </div>
  <div class="menu-buttons">
    <button id="retryBtn">RETRY</button>
    <button id="menuBtn" class="secondary">MENU</button>
  </div>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
(function () {
  "use strict";

  if (typeof THREE === "undefined") {
    document.getElementById("menuScreen").innerHTML =
      '<div class="title" style="font-size:1.6rem;">COULD NOT LOAD 3D ENGINE</div>' +
      '<div class="subtitle">This game needs an internet connection the first time it runs (to fetch three.js). Reconnect and reload.</div>';
    return;
  }

  // ---------------------------------------------------------------------
  // Canvas / renderer sizing
  // ---------------------------------------------------------------------
  const canvas = document.getElementById("gameCanvas");
  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = window.innerWidth, H = window.innerHeight;

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(DPR);
  renderer.setSize(W, H, false);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(62, W / H, 0.1, 400);

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(DPR);
    renderer.setSize(W, H, false);
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);

  // ---------------------------------------------------------------------
  // Constants
  //
  // Controls are a single hold axis (Exo One style: one input, two forms)
  // instead of a hidden hold-duration timer across three states — that
  // timer was the "uninstinctive" part of the old build.
  //   HOLD    -> "dive"  : heavy gravity, digs into downhill slopes for speed
  //   RELEASE -> "glide" : very light gravity, long airtime, drifts far
  // ---------------------------------------------------------------------
  const DIVE_GRAVITY = 2.4;      // was 1.5 — pressing down now feels forceful
  const GLIDE_GRAVITY = 0.028;   // was 0.1 — glide barely falls, covers huge distance
  const SLOPE_DIVE_GAIN = 1.85;  // was 0.9 — diving into a downslope launches speed hard
  const GLIDE_VX_DECAY = 0.9997; // was 0.997 — glide keeps almost all of its speed
  const GLIDE_VY_CAP = 6.5;      // soft cap so a long glide doesn't creep into a dive-like fall
  const LAUNCH_IMPULSE = 0.82;   // was 0.6 — steeper hills need a stronger pop off the crest

  const BASE_SPEED = 5.4;
  const MAX_SPEED = 15;
  const SPEED_TIME_GAIN = 0.0018;

  const GROUND_Y_FRACTION = 0.62; // legacy baseline reference (screen-space feel, kept for tuning)
  const SEGMENT_SPACING = 10;
  const CHUNK_LENGTH = 900;

  // World-space scale: physics runs in the original pixel-ish units so all
  // the slope/speed tuning above still reads the same; this just maps that
  // space down into sane three.js world units.
  const WORLD_SCALE = 1 / 26;
  const LANE_HALF_WIDTH = 5.5;

  const STATE_COLORS = {
    dive:  { core: 0xff5a33, glow: "rgba(255,90,51,0.6)", light: 0xff7a45 },
    glide: { core: 0xeafcff, glow: "rgba(220,250,255,0.65)", light: 0x9fe8ff },
  };

  // ---------------------------------------------------------------------
  // Audio (tiny WebAudio blips, no external assets)
  // ---------------------------------------------------------------------
  let audioCtx = null;
  let soundOn = true;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
  }
  function blip(freq, dur, type, gain) {
    if (!soundOn || !audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    g.gain.value = gain || 0.08;
    o.connect(g);
    g.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    g.gain.setValueAtTime(g.gain.value, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    o.start(now);
    o.stop(now + dur);
  }
  function sfxLaunch() { blip(520, 0.18, "triangle", 0.09); }
  function sfxDive() { blip(140, 0.12, "sawtooth", 0.06); }
  function sfxGameOver() { blip(90, 0.5, "square", 0.08); }
  function sfxScoreTick() { blip(880, 0.06, "sine", 0.04); }

  // ---------------------------------------------------------------------
  // Placeholder monetisation hooks
  // ---------------------------------------------------------------------
  function showRewardedAd(onComplete) {
    console.log("[ads] showRewardedAd() called");
    if (onComplete) onComplete(true);
  }
  function showInterstitialAd() {
    console.log("[ads] showInterstitialAd() called");
  }

  // ---------------------------------------------------------------------
  // Terrain generation (physics space: x forward, y down-positive like the
  // original canvas build — only the renderer treats it as 3D)
  // ---------------------------------------------------------------------
  let terrainPoints = [];
  let terrainRightEdge = 0;
  let terrainChunks = []; // { fromX, toX, mesh, edge }

  function generateTerrainSegment(startX, length, amplitude, frequency, noiseAmount, baseline) {
    const points = [];
    for (let x = startX; x < startX + length; x += SEGMENT_SPACING) {
      const baseY = Math.sin(x * frequency) * amplitude + Math.sin(x * frequency * 2.3) * amplitude * 0.4;
      const noise = (Math.random() - 0.5) * noiseAmount;
      points.push({ x, y: baseline + baseY + noise });
    }
    return points;
  }

  function difficultyParams(distance) {
    const t = Math.min(distance / 6000, 1); // ramps up over the first ~6000m
    return {
      amplitude: 60 + t * 190,      // steeper hills, was 40 + t*90
      frequency: 0.008 + t * 0.015, // tighter hills, was 0.006 + t*0.006
      noiseAmount: 3 + t * 15,
    };
  }

  function buildChunkMesh(points, baseline) {
    if (points.length < 2) return null;
    const vertCount = points.length * 2;
    const positions = new Float32Array(vertCount * 3);
    const colors = new Float32Array(vertCount * 3);
    const topColor = new THREE.Color(0x2a1f66);
    const bottomColor = new THREE.Color(0x0a0620);

    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      const wxp = p.x * WORLD_SCALE;
      const wyp = (baseline - p.y) * WORLD_SCALE;
      // near edge (z = -half) and far edge (z = +half) of the lane
      positions[i * 6 + 0] = wxp;
      positions[i * 6 + 1] = wyp;
      positions[i * 6 + 2] = -LANE_HALF_WIDTH;
      positions[i * 6 + 3] = wxp;
      positions[i * 6 + 4] = wyp;
      positions[i * 6 + 5] = LANE_HALF_WIDTH;
      colors[i * 6 + 0] = topColor.r; colors[i * 6 + 1] = topColor.g; colors[i * 6 + 2] = topColor.b;
      colors[i * 6 + 3] = bottomColor.r; colors[i * 6 + 4] = bottomColor.g; colors[i * 6 + 5] = bottomColor.b;
    }

    const indices = [];
    for (let i = 0; i < points.length - 1; i++) {
      const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
      indices.push(a, c, b, b, c, d);
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({
      vertexColors: true, metalness: 0.15, roughness: 0.55,
      emissive: 0x120a30, emissiveIntensity: 0.4,
    });
    const mesh = new THREE.Mesh(geo, mat);

    // Glowing ridge line along the top edge (near side) for the neon look.
    const ridgePts = [];
    for (const p of points) {
      ridgePts.push(new THREE.Vector3(p.x * WORLD_SCALE, (baseline - p.y) * WORLD_SCALE + 0.02, -LANE_HALF_WIDTH));
    }
    const ridgeGeo = new THREE.BufferGeometry().setFromPoints(ridgePts);
    const ridgeMat = new THREE.LineBasicMaterial({ color: 0x4de8ff, transparent: true, opacity: 0.85 });
    const ridge = new THREE.Line(ridgeGeo, ridgeMat);
    mesh.add(ridge);

    return mesh;
  }

  function ensureTerrainAhead(playerX, baseline) {
    while (terrainRightEdge < playerX + 60 + CHUNK_LENGTH) {
      const params = difficultyParams(Math.max(0, playerX));
      const fromX = terrainRightEdge;
      const chunk = generateTerrainSegment(
        fromX, CHUNK_LENGTH, params.amplitude, params.frequency, params.noiseAmount, baseline
      );
      terrainPoints.push(...chunk);
      terrainRightEdge += CHUNK_LENGTH;

      const mesh = buildChunkMesh(chunk, baseline);
      if (mesh) {
        scene.add(mesh);
        terrainChunks.push({ fromX, toX: fromX + CHUNK_LENGTH, mesh });
      }
    }
    // Trim terrain well behind the player.
    while (terrainPoints.length > 2 && terrainPoints[1].x < playerX - 400) {
      terrainPoints.shift();
    }
    while (terrainChunks.length && terrainChunks[0].toX < playerX - 500) {
      const old = terrainChunks.shift();
      scene.remove(old.mesh);
      old.mesh.geometry.dispose();
      old.mesh.material.dispose();
    }
  }

  function terrainYAt(x) {
    for (let i = 0; i < terrainPoints.length - 1; i++) {
      const a = terrainPoints[i], b = terrainPoints[i + 1];
      if (x >= a.x && x <= b.x) {
        const t = (x - a.x) / (b.x - a.x);
        return {
          y: a.y + (b.y - a.y) * t,
          angle: Math.atan2(b.y - a.y, b.x - a.x),
        };
      }
    }
    if (terrainPoints.length) {
      const last = terrainPoints[terrainPoints.length - 1];
      return { y: last.y, angle: 0 };
    }
    return { y: 0, angle: 0 };
  }

  // ---------------------------------------------------------------------
  // Player
  // ---------------------------------------------------------------------
  const player = {
    x: 0, y: 0, vx: BASE_SPEED, vy: 0,
    radius: 14,
    state: "glide",
    isOnGround: false,
    trail: [],
  };

  let baseline = 0;

  const playerGeo = new THREE.SphereGeometry(player.radius * WORLD_SCALE, 24, 18);
  const playerMat = new THREE.MeshStandardMaterial({
    color: STATE_COLORS.glide.core, emissive: STATE_COLORS.glide.core, emissiveIntensity: 0.9,
    metalness: 0.3, roughness: 0.25,
  });
  const playerMesh = new THREE.Mesh(playerGeo, playerMat);
  scene.add(playerMesh);

  const playerLight = new THREE.PointLight(STATE_COLORS.glide.light, 2.2, 14, 2);
  playerMesh.add(playerLight);

  // Trail: a pool of small fading spheres reused every frame.
  const TRAIL_LEN = 20;
  const trailMeshes = [];
  const trailMat = new THREE.MeshBasicMaterial({ color: STATE_COLORS.glide.core, transparent: true });
  for (let i = 0; i < TRAIL_LEN; i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(player.radius * WORLD_SCALE * 0.5, 8, 6), trailMat.clone());
    m.visible = false;
    scene.add(m);
    trailMeshes.push(m);
  }

  function resetPlayer() {
    player.x = 0;
    player.vx = BASE_SPEED;
    player.vy = 0;
    player.state = "glide";
    player.isOnGround = true;
    player.trail = [];
    baseline = 0;
    const t = terrainYAt(player.x);
    player.y = t.y - player.radius;
  }

  // ---------------------------------------------------------------------
  // Input handling — single hold axis, no hidden timers.
  // ---------------------------------------------------------------------
  const input = { isPressed: false };

  function onPressStart() {
    ensureAudio();
    if (!running || paused) return;
    input.isPressed = true;
    player.state = "dive";
    sfxDive();
  }

  function onPressEnd() {
    if (!input.isPressed) return;
    input.isPressed = false;
    if (running && !paused) {
      player.state = "glide";
    }
  }

  canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); onPressStart(); });
  window.addEventListener("pointerup", onPressEnd);
  window.addEventListener("pointercancel", onPressEnd);
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); onPressStart(); }
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "Space") { e.preventDefault(); onPressEnd(); }
  });

  // ---------------------------------------------------------------------
  // Obstacles
  // ---------------------------------------------------------------------
  let obstacles = [];
  let nextObstacleAt = 500;

  const obstacleGeo = {
    ground: new THREE.ConeGeometry(17 * WORLD_SCALE, 34 * WORLD_SCALE, 5),
    round: new THREE.SphereGeometry(15 * WORLD_SCALE, 14, 10),
  };
  const obstacleMat = {
    ground: new THREE.MeshStandardMaterial({ color: 0xff3d6a, emissive: 0xff3d6a, emissiveIntensity: 0.7 }),
    air: new THREE.MeshStandardMaterial({ color: 0xff8f3d, emissive: 0xff8f3d, emissiveIntensity: 0.7 }),
    moving: new THREE.MeshStandardMaterial({ color: 0xffd23d, emissive: 0xffd23d, emissiveIntensity: 0.7 }),
  };

  function chooseRandomType(distance) {
    const roll = Math.random();
    if (distance < 400) return "ground";
    if (roll < 0.4) return "ground";
    if (roll < 0.75) return "air";
    return "moving";
  }

  function spawnObstacle(playerX, distance) {
    const targetX = playerX + 700 + Math.random() * 200;
    const basePoint = terrainPoints.find((p) => p.x > targetX);
    if (!basePoint) return;

    const type = chooseRandomType(distance);
    let obstacle = {
      x: basePoint.x, y: basePoint.y,
      width: 34, height: 34,
      type,
      vy: 0,
      baseY: basePoint.y,
      phase: Math.random() * Math.PI * 2,
    };

    if (type === "air") {
      obstacle.y -= 110 + Math.random() * 40;
      obstacle.width = 30; obstacle.height = 30;
    } else if (type === "moving") {
      obstacle.y -= 70;
      obstacle.baseY = obstacle.y;
      obstacle.vy = 1.4;
      obstacle.width = 30; obstacle.height = 30;
    } else {
      obstacle.y -= obstacle.height; // sits on terrain, spikes up
    }

    const geo = type === "ground" ? obstacleGeo.ground : obstacleGeo.round;
    const mesh = new THREE.Mesh(geo, obstacleMat[type]);
    scene.add(mesh);
    obstacle.mesh = mesh;

    obstacles.push(obstacle);
  }

  function updateObstacles(distance) {
    const t = Math.min(distance / 6000, 1);
    const minGap = 550 - t * 250;
    if (distance > nextObstacleAt) {
      spawnObstacle(player.x, distance);
      nextObstacleAt = distance + minGap + Math.random() * 200;
    }

    for (const o of obstacles) {
      if (o.type === "moving") {
        o.phase += 0.05;
        o.y = o.baseY + Math.sin(o.phase) * 40;
      }
      const cy = o.type === "ground" ? o.y + o.height * 0.5 : o.y + o.height / 2;
      o.mesh.position.set(o.x * WORLD_SCALE, (baseline - cy) * WORLD_SCALE, 0);
      o.mesh.rotation.y += 0.02;
    }

    const stillAlive = [];
    for (const o of obstacles) {
      if (o.x > player.x - 200) { stillAlive.push(o); }
      else { scene.remove(o.mesh); }
    }
    obstacles = stillAlive;
  }

  function checkObstacleCollision() {
    for (const o of obstacles) {
      const closestX = Math.max(o.x, Math.min(player.x, o.x + o.width));
      const closestY = Math.max(o.y, Math.min(player.y, o.y + o.height));
      const dx = player.x - closestX;
      const dy = player.y - closestY;
      if (dx * dx + dy * dy < player.radius * player.radius) {
        return true;
      }
    }
    return false;
  }

  // ---------------------------------------------------------------------
  // Game state
  // ---------------------------------------------------------------------
  let running = false;
  let paused = false;
  let distance = 0;
  let score = 0;
  let airTime = 0;
  let diveStreak = 0;
  let bestScore = Number(localStorage.getItem("slopeSurferBest") || 0);
  let lastTime = 0;

  const biomes = ["dusk", "abyss", "aurora"];
  const biomePalettes = {
    dusk:   { sky: [0x1a1140, 0x7a2f8f], fog: 0x2a1560 },
    abyss:  { sky: [0x050318, 0x123a5e], fog: 0x0a1830 },
    aurora: { sky: [0x071b2e, 0x1f6b5c], fog: 0x0c3028 },
  };
  function biomeForDistance(d) {
    const idx = Math.floor(d / 2500) % 3;
    return biomes[idx];
  }

  function resetGame() {
    for (const c of terrainChunks) { scene.remove(c.mesh); c.mesh.geometry.dispose(); c.mesh.material.dispose(); }
    terrainChunks = [];
    terrainPoints = [];
    terrainRightEdge = 0;
    for (const o of obstacles) scene.remove(o.mesh);
    obstacles = [];
    nextObstacleAt = 500;
    distance = 0;
    score = 0;
    airTime = 0;
    diveStreak = 0;
    resetPlayer();
    ensureTerrainAhead(player.x, baseline);
  }

  function startGame() {
    resetGame();
    running = true;
    paused = false;
    document.getElementById("menuScreen").classList.add("hidden");
    document.getElementById("gameOverScreen").classList.add("hidden");
    document.getElementById("hud").classList.remove("hidden");
    document.getElementById("stateBadge").classList.remove("hidden");
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function endGame() {
    running = false;
    sfxGameOver();
    score = Math.floor(score);
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem("slopeSurferBest", String(bestScore));
    }
    document.getElementById("finalScore").textContent = score;
    document.getElementById("bestScore").textContent = bestScore;
    document.getElementById("hud").classList.add("hidden");
    document.getElementById("stateBadge").classList.add("hidden");
    document.getElementById("gameOverScreen").classList.remove("hidden");
    showInterstitialAd();
  }

  // ---------------------------------------------------------------------
  // Physics update (still 2D under the hood: x = forward, y = height: the
  // 3D layer above is purely a rendering upgrade, so all the dive/glide/
  // slope tuning behaves exactly as felt-tested)
  // ---------------------------------------------------------------------
  function updatePhysics(dt) {
    player.vx = Math.min(MAX_SPEED, player.vx + SPEED_TIME_GAIN * dt);

    const t = terrainYAt(player.x);
    const groundY = t.y;
    const slopeAngle = t.angle;
    const distToGround = groundY - (player.y + player.radius);

    const gravity = player.state === "dive" ? DIVE_GRAVITY : GLIDE_GRAVITY;

    if (player.isOnGround) {
      if (player.state === "dive" && slopeAngle > 0.05) {
        player.vx = Math.min(MAX_SPEED, player.vx + slopeAngle * SLOPE_DIVE_GAIN);
        diveStreak += dt;
      } else {
        diveStreak = 0;
      }

      player.vy = 0;
      player.y = groundY - player.radius;

      const aheadY = terrainYAt(player.x + player.vx * 2).y;
      const drop = aheadY - groundY;
      if (drop > 24 || (slopeAngle < -0.32 && player.state !== "dive")) {
        player.isOnGround = false;
        player.vy = -Math.abs(player.vx * LAUNCH_IMPULSE);
        sfxLaunch();
      }
    } else {
      player.vy += gravity;
      if (player.state === "glide") {
        player.vy = Math.min(player.vy, GLIDE_VY_CAP);
        player.vx *= GLIDE_VX_DECAY;
      }
      player.y += player.vy;

      if (distToGround <= 0 && player.vy >= 0) {
        player.isOnGround = true;
        player.y = groundY - player.radius;
        player.vy = 0;
      }
    }

    player.x += player.vx;

    if (!player.isOnGround) airTime += dt / 1000;

    distance = Math.max(distance, player.x);
    const distScore = distance * 0.05;
    const airScore = airTime * 1.2;
    const diveBonus = diveStreak > 400 ? (diveStreak / 400) * 0.5 : 0;
    score = distScore + airScore + diveBonus;

    player.trail.push({ x: player.x, y: player.y });
    if (player.trail.length > TRAIL_LEN) player.trail.shift();

    ensureTerrainAhead(player.x, baseline);
    updateObstacles(distance);

    if (checkObstacleCollision()) {
      endGame();
    }

    if ((baseline - player.y) < -600) {
      endGame();
    }
  }

  // ---------------------------------------------------------------------
  // 3D scene setup: lights, sky/fog
  // ---------------------------------------------------------------------
  const ambient = new THREE.AmbientLight(0x8899ff, 0.55);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xffffff, 1.1);
  sun.position.set(-6, 10, 6);
  scene.add(sun);

  let currentBiome = null;
  function applyBiome(biome) {
    if (biome === currentBiome) return;
    currentBiome = biome;
    const p = biomePalettes[biome];
    scene.background = new THREE.Color(p.sky[0]);
    scene.fog = new THREE.Fog(p.fog, 20, 95);
  }
  applyBiome("dusk");

  // ---------------------------------------------------------------------
  // Camera follow — trails behind and slightly above, pulls tighter/lower
  // on a dive and pulls back/higher on a glide for a bit of game feel.
  // ---------------------------------------------------------------------
  const camPos = new THREE.Vector3(-6, 4.5, 9);
  const camTarget = new THREE.Vector3();
  function updateCamera() {
    const wxp = player.x * WORLD_SCALE;
    const wyp = (baseline - player.y) * WORLD_SCALE;
    const isDive = player.state === "dive";
    const behind = isDive ? 6.4 : 7.6;
    const above = isDive ? 3.2 : 4.4;
    const side = isDive ? 8.4 : 9.6;

    const desired = new THREE.Vector3(wxp - behind, wyp + above, side);
    camPos.lerp(desired, 0.08);
    camera.position.copy(camPos);

    camTarget.set(wxp + 4, wyp + 1, 0);
    camera.lookAt(camTarget);
  }

  // ---------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------
  function updateVisuals() {
    const colors = STATE_COLORS[player.state];
    playerMat.color.set(colors.core);
    playerMat.emissive.set(colors.core);
    playerLight.color.set(colors.light);

    playerMesh.position.set(player.x * WORLD_SCALE, (baseline - player.y) * WORLD_SCALE, 0);
    playerMesh.rotation.z -= player.vx * 0.02;

    for (let i = 0; i < TRAIL_LEN; i++) {
      const idx = player.trail.length - TRAIL_LEN + i;
      const m = trailMeshes[i];
      if (idx < 0 || idx >= player.trail.length - 1) { m.visible = false; continue; }
      const pt = player.trail[idx];
      m.visible = true;
      m.position.set(pt.x * WORLD_SCALE, (baseline - pt.y) * WORLD_SCALE, 0);
      const f = i / TRAIL_LEN;
      m.material.color.set(colors.core);
      m.material.opacity = f * 0.4;
      const s = 0.3 + 0.5 * f;
      m.scale.set(s, s, s);
    }

    applyBiome(biomeForDistance(distance));
    updateCamera();
  }

  // ---------------------------------------------------------------------
  // HUD updates
  // ---------------------------------------------------------------------
  let lastScoreTickAt = 0;
  function updateHUD() {
    document.getElementById("hudDistance").textContent = Math.floor(distance);
    document.getElementById("hudScore").textContent = Math.floor(score);
    const badge = document.getElementById("stateBadge");
    badge.textContent = player.state.toUpperCase();
    const c = STATE_COLORS[player.state];
    badge.style.background = c.glow;
    badge.style.borderColor = "#" + c.core.toString(16).padStart(6, "0");
    badge.style.color = "#0a0620";

    if (Math.floor(score / 100) > lastScoreTickAt) {
      lastScoreTickAt = Math.floor(score / 100);
      sfxScoreTick();
    }
  }

  // ---------------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------------
  function loop(now) {
    if (!running) return;
    let dt = now - lastTime;
    lastTime = now;
    dt = Math.min(dt, 40); // clamp for tab-switch hiccups (physics constants are tuned for ~60fps frames)

    updatePhysics(dt);
    updateVisuals();
    renderer.render(scene, camera);
    updateHUD();

    if (running) requestAnimationFrame(loop);
  }

  // ---------------------------------------------------------------------
  // UI wiring
  // ---------------------------------------------------------------------
  document.getElementById("playBtn").addEventListener("click", () => { ensureAudio(); startGame(); });
  document.getElementById("retryBtn").addEventListener("click", () => { ensureAudio(); startGame(); });
  document.getElementById("menuBtn").addEventListener("click", () => {
    document.getElementById("gameOverScreen").classList.add("hidden");
    document.getElementById("menuScreen").classList.remove("hidden");
  });
  document.getElementById("soundToggleBtn").addEventListener("click", (e) => {
    soundOn = !soundOn;
    e.target.textContent = "SOUND: " + (soundOn ? "ON" : "OFF");
  });

  window.addEventListener("contextmenu", (e) => e.preventDefault());

  // Initial idle background render (menu is up front).
  resetPlayer();
  ensureTerrainAhead(player.x, baseline);
  applyBiome("dusk");
  updateVisuals();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>

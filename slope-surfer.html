<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Slope Surfer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0620;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    color: #eafcff;
    text-align: center;
    z-index: 10;
  }
  .hidden { display: none !important; }
  .title {
    font-size: clamp(2.2rem, 9vw, 3.6rem);
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #4de8ff, #a06bff, #ff5fb0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(120, 100, 255, 0.5);
  }
  .subtitle {
    color: #9aa3d0;
    font-size: 0.95rem;
    letter-spacing: 1px;
    max-width: 320px;
    line-height: 1.5;
  }
  button {
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 1px;
    color: #0a0620;
    background: linear-gradient(90deg, #4de8ff, #8f6bff);
    border: none;
    border-radius: 999px;
    padding: 14px 42px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(90, 150, 255, 0.5);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button:active { transform: scale(0.95); }
  button.secondary {
    background: transparent;
    color: #cfe6ff;
    border: 2px solid #4de8ff88;
    box-shadow: none;
    padding: 12px 40px;
  }
  .menu-buttons { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
  .toggle-row {
    display: flex; align-items: center; gap: 10px;
    color: #9aa3d0; font-size: 0.9rem;
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: env(safe-area-inset-top, 14px) 18px 0 18px;
    color: #eafcff;
    z-index: 5;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  .hud-box {
    background: rgba(15, 10, 40, 0.55);
    border: 1px solid rgba(120, 180, 255, 0.25);
    border-radius: 10px;
    padding: 6px 14px;
    font-size: 0.95rem;
    letter-spacing: 0.5px;
    backdrop-filter: blur(4px);
  }
  .hud-box b { color: #4de8ff; }
  .state-badge {
    position: absolute;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 1px;
    z-index: 5;
    border: 1px solid transparent;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .stat-line { display: flex; gap: 22px; margin: 4px 0 10px; font-size: 1rem; }
  .stat-line span b { color: #4de8ff; }
  #muteBtn {
    pointer-events: auto;
    background: rgba(15, 10, 40, 0.55);
    border: 1px solid rgba(120, 180, 255, 0.25);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 1rem;
    box-shadow: none;
    color: #eafcff;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="hud" class="hidden">
  <div class="hud-box">DIST <b id="hudDistance">0</b>m</div>
  <div class="hud-box">SCORE <b id="hudScore">0</b></div>
</div>
<div id="stateBadge" class="state-badge hidden">NORMAL</div>

<div id="menuScreen" class="screen">
  <div class="title">SLOPE SURFER</div>
  <div class="subtitle">Tap and hold to control gravity. Sink into slopes for speed, glide over hazards, launch off every hill.</div>
  <div class="menu-buttons">
    <button id="playBtn">PLAY</button>
    <button id="soundToggleBtn" class="secondary">SOUND: ON</button>
  </div>
  <div class="subtitle" style="margin-top:6px;">TAP = dive &nbsp;·&nbsp; HOLD = glide &nbsp;·&nbsp; RELEASE = launch</div>
</div>

<div id="gameOverScreen" class="screen hidden">
  <div class="title" style="font-size: clamp(1.8rem, 7vw, 2.6rem);">RUN OVER</div>
  <div class="stat-line">
    <span>SCORE<br><b id="finalScore">0</b></span>
    <span>BEST<br><b id="bestScore">0</b></span>
  </div>
  <div class="menu-buttons">
    <button id="retryBtn">RETRY</button>
    <button id="menuBtn" class="secondary">MENU</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // Canvas / sizing
  // ---------------------------------------------------------------------
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------------------------------------------------------------------
  // Constants
  // ---------------------------------------------------------------------
  const NORMAL_GRAVITY = 0.5;
  const HEAVY_GRAVITY = 1.5;
  const GLIDE_GRAVITY = 0.1;
  const GLIDE_THRESHOLD_MS = 300;

  const BASE_SPEED = 5.2;
  const MAX_SPEED = 13;
  const SPEED_TIME_GAIN = 0.0018; // gentle passive acceleration

  const GROUND_Y_FRACTION = 0.62; // where the terrain baseline sits on screen
  const SEGMENT_SPACING = 10;
  const CHUNK_LENGTH = 900;

  const STATE_COLORS = {
    normal: { core: "#4de8ff", glow: "rgba(77,232,255,0.55)" },
    heavy:  { core: "#ff6a3d", glow: "rgba(255,106,61,0.6)" },
    glide:  { core: "#e8fbff", glow: "rgba(220,250,255,0.65)" },
  };

  // ---------------------------------------------------------------------
  // Audio (tiny WebAudio blips, no external assets)
  // ---------------------------------------------------------------------
  let audioCtx = null;
  let soundOn = true;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
  }
  function blip(freq, dur, type, gain) {
    if (!soundOn || !audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    g.gain.value = gain || 0.08;
    o.connect(g);
    g.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    g.gain.setValueAtTime(g.gain.value, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    o.start(now);
    o.stop(now + dur);
  }
  function sfxLaunch() { blip(520, 0.18, "triangle", 0.09); }
  function sfxDive() { blip(140, 0.12, "sawtooth", 0.06); }
  function sfxGameOver() { blip(90, 0.5, "square", 0.08); }
  function sfxScoreTick() { blip(880, 0.06, "sine", 0.04); }

  // ---------------------------------------------------------------------
  // Placeholder monetisation hooks
  // ---------------------------------------------------------------------
  function showRewardedAd(onComplete) {
    // Placeholder: integrate a real ad SDK here.
    console.log("[ads] showRewardedAd() called");
    if (onComplete) onComplete(true);
  }
  function showInterstitialAd() {
    console.log("[ads] showInterstitialAd() called");
  }

  // ---------------------------------------------------------------------
  // Terrain generation
  // ---------------------------------------------------------------------
  let terrainPoints = [];
  let terrainRightEdge = 0;

  function generateTerrainSegment(startX, length, amplitude, frequency, noiseAmount, baseline) {
    const points = [];
    for (let x = startX; x < startX + length; x += SEGMENT_SPACING) {
      const baseY = Math.sin(x * frequency) * amplitude + Math.sin(x * frequency * 2.3) * amplitude * 0.25;
      const noise = (Math.random() - 0.5) * noiseAmount;
      points.push({ x, y: baseline + baseY + noise });
    }
    return points;
  }

  function difficultyParams(distance) {
    const t = Math.min(distance / 6000, 1); // ramps up over the first ~6000m
    return {
      amplitude: 40 + t * 90,
      frequency: 0.006 + t * 0.006,
      noiseAmount: 2 + t * 10,
    };
  }

  function ensureTerrainAhead(playerX, baseline) {
    while (terrainRightEdge < playerX + W + CHUNK_LENGTH) {
      const params = difficultyParams(Math.max(0, playerX));
      const chunk = generateTerrainSegment(
        terrainRightEdge, CHUNK_LENGTH, params.amplitude, params.frequency, params.noiseAmount, baseline
      );
      terrainPoints.push(...chunk);
      terrainRightEdge += CHUNK_LENGTH;
    }
    // Trim terrain well behind the player.
    while (terrainPoints.length > 2 && terrainPoints[1].x < playerX - 400) {
      terrainPoints.shift();
    }
  }

  function terrainYAt(x) {
    // Binary-ish scan (terrain array is small enough for linear scan given trimming).
    for (let i = 0; i < terrainPoints.length - 1; i++) {
      const a = terrainPoints[i], b = terrainPoints[i + 1];
      if (x >= a.x && x <= b.x) {
        const t = (x - a.x) / (b.x - a.x);
        return {
          y: a.y + (b.y - a.y) * t,
          angle: Math.atan2(b.y - a.y, b.x - a.x),
        };
      }
    }
    // Fallback: nearest point.
    if (terrainPoints.length) {
      const last = terrainPoints[terrainPoints.length - 1];
      return { y: last.y, angle: 0 };
    }
    return { y: 0, angle: 0 };
  }

  // ---------------------------------------------------------------------
  // Player
  // ---------------------------------------------------------------------
  const player = {
    x: 0, y: 0, vx: BASE_SPEED, vy: 0,
    radius: 14,
    state: "normal",
    isOnGround: false,
    trail: [],
  };

  let camX = 0;
  let baseline = 0;

  function resetPlayer() {
    player.x = 0;
    player.vx = BASE_SPEED;
    player.vy = 0;
    player.state = "normal";
    player.isOnGround = true;
    player.trail = [];
    baseline = H * GROUND_Y_FRACTION;
    const t = terrainYAt(player.x);
    player.y = t.y - player.radius;
    camX = 0;
  }

  // ---------------------------------------------------------------------
  // Input handling
  // ---------------------------------------------------------------------
  const input = {
    isPressed: false,
    pressStart: 0,
    pressDuration: 0,
  };

  function onPressStart() {
    ensureAudio();
    if (!running || paused) return;
    input.isPressed = true;
    input.pressStart = performance.now();
    input.pressDuration = 0;
    if (player.state !== "glide") {
      player.state = "heavy";
      sfxDive();
    }
  }

  function onPressEnd() {
    if (!input.isPressed) return;
    input.isPressed = false;
    input.pressDuration = 0;
    if (running && !paused) {
      player.state = "normal";
    }
  }

  function updateInputState() {
    if (input.isPressed) {
      input.pressDuration = performance.now() - input.pressStart;
      if (input.pressDuration >= GLIDE_THRESHOLD_MS) {
        player.state = "glide";
      }
    }
  }

  canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); onPressStart(); });
  window.addEventListener("pointerup", onPressEnd);
  window.addEventListener("pointercancel", onPressEnd);
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); onPressStart(); }
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "Space") { e.preventDefault(); onPressEnd(); }
  });

  // ---------------------------------------------------------------------
  // Obstacles
  // ---------------------------------------------------------------------
  let obstacles = [];
  let nextObstacleAt = 500;

  function chooseRandomType(distance) {
    const roll = Math.random();
    if (distance < 400) return "ground";
    if (roll < 0.4) return "ground";
    if (roll < 0.75) return "air";
    return "moving";
  }

  function spawnObstacle(playerX, distance) {
    const targetX = playerX + W + 250 + Math.random() * 150;
    const basePoint = terrainPoints.find((p) => p.x > targetX);
    if (!basePoint) return;

    const type = chooseRandomType(distance);
    let obstacle = {
      x: basePoint.x, y: basePoint.y,
      width: 34, height: 34,
      type,
      vy: 0, vx: 0,
      baseY: basePoint.y,
      phase: Math.random() * Math.PI * 2,
      passed: false,
    };

    if (type === "air") {
      obstacle.y -= 110 + Math.random() * 40;
      obstacle.width = 30; obstacle.height = 30;
    } else if (type === "moving") {
      obstacle.y -= 70;
      obstacle.baseY = obstacle.y;
      obstacle.vy = 1.4;
      obstacle.width = 30; obstacle.height = 30;
    } else {
      obstacle.y -= obstacle.height; // sits on terrain, spikes up
    }

    obstacles.push(obstacle);
  }

  function updateObstacles(distance) {
    // Spawn based on distance, spacing tightens with difficulty.
    const t = Math.min(distance / 6000, 1);
    const minGap = 550 - t * 250;
    if (distance > nextObstacleAt) {
      spawnObstacle(player.x, distance);
      nextObstacleAt = distance + minGap + Math.random() * 200;
    }

    for (const o of obstacles) {
      if (o.type === "moving") {
        o.phase += 0.05;
        o.y = o.baseY + Math.sin(o.phase) * 40;
      }
    }
    obstacles = obstacles.filter((o) => o.x > player.x - 200);
  }

  function checkObstacleCollision() {
    for (const o of obstacles) {
      // AABB vs circle (approximate with expanded box).
      const closestX = Math.max(o.x, Math.min(player.x, o.x + o.width));
      const closestY = Math.max(o.y, Math.min(player.y, o.y + o.height));
      const dx = player.x - closestX;
      const dy = player.y - closestY;
      if (dx * dx + dy * dy < player.radius * player.radius) {
        return true;
      }
    }
    return false;
  }

  // ---------------------------------------------------------------------
  // Game state
  // ---------------------------------------------------------------------
  let running = false;
  let paused = false;
  let distance = 0;
  let score = 0;
  let airTime = 0;
  let diveStreak = 0;
  let bestScore = Number(localStorage.getItem("slopeSurferBest") || 0);
  let lastTime = 0;
  let wasOnGround = true;

  function biomeForDistance(d) {
    const idx = Math.floor(d / 2500) % 3;
    return ["dusk", "abyss", "aurora"][idx];
  }

  function resetGame() {
    terrainPoints = [];
    terrainRightEdge = 0;
    obstacles = [];
    nextObstacleAt = 500;
    distance = 0;
    score = 0;
    airTime = 0;
    diveStreak = 0;
    wasOnGround = true;
    resetPlayer();
    ensureTerrainAhead(player.x, baseline);
  }

  function startGame() {
    resetGame();
    running = true;
    paused = false;
    document.getElementById("menuScreen").classList.add("hidden");
    document.getElementById("gameOverScreen").classList.add("hidden");
    document.getElementById("hud").classList.remove("hidden");
    document.getElementById("stateBadge").classList.remove("hidden");
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function endGame() {
    running = false;
    sfxGameOver();
    score = Math.floor(score);
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem("slopeSurferBest", String(bestScore));
    }
    document.getElementById("finalScore").textContent = score;
    document.getElementById("bestScore").textContent = bestScore;
    document.getElementById("hud").classList.add("hidden");
    document.getElementById("stateBadge").classList.add("hidden");
    document.getElementById("gameOverScreen").classList.remove("hidden");
    showInterstitialAd();
  }

  // ---------------------------------------------------------------------
  // Physics update
  // ---------------------------------------------------------------------
  function updatePhysics(dt) {
    updateInputState();

    // Passive horizontal acceleration over time.
    player.vx = Math.min(MAX_SPEED, player.vx + SPEED_TIME_GAIN * dt);

    const t = terrainYAt(player.x);
    const groundY = t.y;
    const slopeAngle = t.angle;
    const distToGround = groundY - (player.y + player.radius);

    let gravity = NORMAL_GRAVITY;
    if (player.state === "heavy") gravity = HEAVY_GRAVITY;
    else if (player.state === "glide") gravity = GLIDE_GRAVITY;

    if (player.isOnGround) {
      // Snap-follow terrain while grounded.
      if (player.state === "heavy" && slopeAngle > 0.05) {
        // Downward slope while diving: gain speed proportional to slope angle.
        player.vx = Math.min(MAX_SPEED, player.vx + slopeAngle * 0.9);
        diveStreak += dt;
      } else {
        diveStreak = 0;
      }

      if (player.state === "glide") {
        // Glide reduces horizontal push slightly for a controlled feel.
        player.vx *= 0.999;
      }

      player.vy = 0;
      player.y = groundY - player.radius;

      // Check if the ground ahead drops away (launch condition) or slope
      // flips sharply upward (crest condition).
      const aheadY = terrainYAt(player.x + player.vx * 2).y;
      const drop = aheadY - groundY;
      if (drop > 26 || (slopeAngle < -0.35 && player.state !== "heavy")) {
        player.isOnGround = false;
        player.vy = -Math.abs(player.vx * 0.6);
        sfxLaunch();
      }
    } else {
      player.vy += gravity;
      if (player.state === "glide") {
        player.vy = Math.min(player.vy, 3.2); // slow, controlled descent
        player.vx *= 0.997;
      }
      player.y += player.vy;
      player.x += 0; // x integrated below with vx

      if (distToGround <= 0 && player.vy >= 0) {
        // Landed.
        player.isOnGround = true;
        player.y = groundY - player.radius;
        player.vy = 0;
      }
    }

    player.x += player.vx;

    // Track air time for scoring.
    if (!player.isOnGround) airTime += dt / 1000;

    // Score accumulation.
    distance = Math.max(distance, player.x);
    const distScore = distance * 0.05;
    const airScore = airTime * 1.2;
    const diveBonus = diveStreak > 400 ? (diveStreak / 400) * 0.5 : 0;
    score = distScore + airScore + diveBonus;

    // Trail.
    player.trail.push({ x: player.x, y: player.y });
    if (player.trail.length > 18) player.trail.shift();

    ensureTerrainAhead(player.x, baseline);
    updateObstacles(distance);

    if (checkObstacleCollision()) {
      endGame();
    }

    // Falling off the bottom of the screen is also game over (shouldn't
    // normally happen, but guards against edge cases in terrain gen).
    if (player.y - camY() > H + 200) {
      endGame();
    }
  }

  function camY() { return 0; }

  // ---------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------
  const biomePalettes = {
    dusk:    ["#1a1140", "#3a1f6b", "#7a2f8f"],
    abyss:   ["#050318", "#0d1a3d", "#123a5e"],
    aurora:  ["#071b2e", "#0f3d3e", "#1f6b5c"],
  };

  function draw() {
    camX = player.x - W * 0.28;

    // Background gradient by biome.
    const biome = biomeForDistance(distance);
    const palette = biomePalettes[biome];
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, palette[0]);
    g.addColorStop(0.55, palette[1]);
    g.addColorStop(1, palette[2]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Parallax stars/particles.
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = "#ffffff";
    for (let i = 0; i < 40; i++) {
      const sx = (i * 137 - camX * 0.15) % W;
      const sy = (i * 71) % (H * 0.5);
      ctx.fillRect(((sx % W) + W) % W, sy, 2, 2);
    }
    ctx.restore();

    // Terrain.
    ctx.save();
    ctx.translate(-camX, 0);
    ctx.beginPath();
    let started = false;
    for (const p of terrainPoints) {
      if (p.x < camX - 50 || p.x > camX + W + 50) continue;
      if (!started) { ctx.moveTo(p.x, p.y); started = true; }
      else ctx.lineTo(p.x, p.y);
    }
    if (started) {
      ctx.lineTo(camX + W + 50, H + 50);
      ctx.lineTo(camX - 50, H + 50);
      ctx.closePath();
      const tg = ctx.createLinearGradient(0, baseline - 100, 0, H);
      tg.addColorStop(0, "rgba(77,232,255,0.18)");
      tg.addColorStop(1, "rgba(160,107,255,0.05)");
      ctx.fillStyle = tg;
      ctx.fill();

      ctx.lineWidth = 3;
      ctx.strokeStyle = "#4de8ff";
      ctx.shadowColor = "#4de8ff";
      ctx.shadowBlur = 12;
      ctx.beginPath();
      started = false;
      for (const p of terrainPoints) {
        if (p.x < camX - 50 || p.x > camX + W + 50) continue;
        if (!started) { ctx.moveTo(p.x, p.y); started = true; }
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // Obstacles.
    for (const o of obstacles) {
      if (o.x < camX - 60 || o.x > camX + W + 60) continue;
      ctx.save();
      if (o.type === "ground") {
        ctx.fillStyle = "#ff3d6a";
        ctx.shadowColor = "#ff3d6a";
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.moveTo(o.x, o.y + o.height);
        ctx.lineTo(o.x + o.width / 2, o.y);
        ctx.lineTo(o.x + o.width, o.y + o.height);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillStyle = o.type === "moving" ? "#ffd23d" : "#ff8f3d";
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(o.x + o.width / 2, o.y + o.height / 2, o.width / 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Player trail.
    const colors = STATE_COLORS[player.state];
    for (let i = 0; i < player.trail.length; i++) {
      const pt = player.trail[i];
      const alpha = (i / player.trail.length) * 0.35;
      ctx.beginPath();
      ctx.fillStyle = colors.glow;
      ctx.globalAlpha = alpha;
      ctx.arc(pt.x, pt.y, player.radius * (0.4 + 0.5 * (i / player.trail.length)), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Player ball.
    ctx.beginPath();
    ctx.fillStyle = colors.core;
    ctx.shadowColor = colors.glow;
    ctx.shadowBlur = 25;
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  // ---------------------------------------------------------------------
  // HUD updates
  // ---------------------------------------------------------------------
  let lastScoreTickAt = 0;
  function updateHUD() {
    document.getElementById("hudDistance").textContent = Math.floor(distance);
    document.getElementById("hudScore").textContent = Math.floor(score);
    const badge = document.getElementById("stateBadge");
    badge.textContent = player.state.toUpperCase();
    const c = STATE_COLORS[player.state];
    badge.style.background = c.glow;
    badge.style.borderColor = c.core;
    badge.style.color = "#0a0620";

    if (Math.floor(score / 100) > lastScoreTickAt) {
      lastScoreTickAt = Math.floor(score / 100);
      sfxScoreTick();
    }
  }

  // ---------------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------------
  function loop(now) {
    if (!running) return;
    let dt = now - lastTime;
    lastTime = now;
    dt = Math.min(dt, 40); // clamp for tab-switch hiccups (physics constants are tuned for ~60fps frames)

    updatePhysics(dt);
    draw();
    updateHUD();

    if (running) requestAnimationFrame(loop);
  }

  // ---------------------------------------------------------------------
  // UI wiring
  // ---------------------------------------------------------------------
  document.getElementById("playBtn").addEventListener("click", () => { ensureAudio(); startGame(); });
  document.getElementById("retryBtn").addEventListener("click", () => { ensureAudio(); startGame(); });
  document.getElementById("menuBtn").addEventListener("click", () => {
    document.getElementById("gameOverScreen").classList.add("hidden");
    document.getElementById("menuScreen").classList.remove("hidden");
  });
  document.getElementById("soundToggleBtn").addEventListener("click", (e) => {
    soundOn = !soundOn;
    e.target.textContent = "SOUND: " + (soundOn ? "ON" : "OFF");
  });

  // Prevent context menu / text selection interference on mobile.
  window.addEventListener("contextmenu", (e) => e.preventDefault());

  // Initial idle background render (menu is up front).
  resetPlayer();
  ensureTerrainAhead(player.x, baseline);
  draw();
})();
</script>
</body>
</html>

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_print: true

analyzer:
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - build/**
    - android/**
    - ios/**
    # Not part of the Flutter project — the Cloud Functions side is
    # TypeScript, but firebase-tools (an npm devDependency there) ships a
    # template .dart file under its own node_modules that the analyzer
    # would otherwise try to resolve against this project's dependencies.
    - firebase/**
    - web/**

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EV Charger Route Planner</title>

  <!-- Leaflet's stylesheet. Leaflet is the free library that draws the map. -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <header>
    <h1>⚡ EV Charger Route Planner</h1>
    <p class="subtitle">Enter a start and destination to see EV chargers along your route.</p>
  </header>

  <!-- The form where you type your trip details -->
  <form id="trip-form">
    <div class="field">
      <label for="start">Start location</label>
      <input id="start" type="text" placeholder="e.g. Austin, TX" required />
    </div>

    <div class="field">
      <label for="destination">Destination</label>
      <input id="destination" type="text" placeholder="e.g. Dallas, TX" required />
    </div>

    <div class="field">
      <label for="range" id="range-label">Car range in mi (optional)</label>
      <div class="range-row">
        <input id="range" type="number" min="1" placeholder="e.g. 250" />
        <div class="unit-toggle">
          <button type="button" id="unit-mi-btn" class="toggle-btn" aria-pressed="true">mi</button>
          <button type="button" id="unit-km-btn" class="toggle-btn" aria-pressed="false">km</button>
        </div>
      </div>
    </div>

    <button type="submit" id="find-btn">Find Routes</button>
  </form>

  <!-- Status messages: "Loading...", errors, etc. -->
  <p id="status" role="status"></p>

  <!-- Shown after route lookup: 2-3 route options as clickable boxes,
       each showing drive time and distance. Pick one to see it on the map. -->
  <div id="route-picker" class="picker" hidden>
    <h2>Choose a route</h2>
    <div id="route-options" class="option-grid"></div>
  </div>

  <!-- Shown once a route is picked and you entered a car range: 2-3
       charging-plan strategies as clickable boxes for that route. -->
  <div id="plan-picker" class="picker" hidden>
    <h2>Choose a charging plan</h2>
    <div id="plan-options" class="option-grid"></div>
  </div>

  <!-- The written stop-by-stop detail for whichever plan box is selected. -->
  <div id="plan" class="plan" hidden>
    <h2>⚡ Charging plan</h2>
    <div id="plan-content"></div>
  </div>

  <!-- Shown once chargers are found: lets you switch what the pin colors mean,
       and explains what each color is. Hidden until there are results. -->
  <div id="legend" class="legend" hidden>
    <div class="legend-toggle">
      <span>Color pins by:</span>
      <button type="button" id="mode-speed-btn" class="toggle-btn" aria-pressed="true">Charging speed</button>
      <button type="button" id="mode-plug-btn" class="toggle-btn" aria-pressed="false">Plug type</button>
    </div>
    <div id="legend-items" class="legend-items"></div>
  </div>

  <!-- The map itself gets drawn inside this div by Leaflet -->
  <div id="map"></div>

  <!-- Leaflet's JavaScript library -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=2"></script>
</body>
</html>

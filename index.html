<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EV Charger Route Planner</title>

  <!-- Leaflet's stylesheet. Leaflet is the free library that draws the map. -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <link rel="stylesheet" href="style.css?v=8" />
</head>
<body>
  <header>
    <h1>⚡ EV Charger Route Planner</h1>
    <p class="subtitle">Enter a start and destination to see EV chargers along your route.</p>
  </header>

  <!-- The form where you type your trip details -->
  <form id="trip-form">
    <div class="field">
      <label for="start">Start location</label>
      <!-- Placeholder text below is a static fallback only — app.js swaps
           it for a country-appropriate example (renderPlaceholders()) the
           moment it runs, using the same country detection as the brand
           pickers. -->
      <input id="start" type="text" placeholder="e.g. Austin" required />
    </div>

    <div class="field">
      <label for="destination">Destination</label>
      <input id="destination" type="text" placeholder="e.g. Dallas" required />
    </div>

    <div class="field">
      <label for="range" id="range-label">Car range in mi (optional)</label>
      <div class="range-row">
        <input id="range" type="number" min="1" placeholder="e.g. 250" />
        <div class="unit-toggle">
          <button type="button" id="unit-mi-btn" class="toggle-btn" aria-pressed="true">mi</button>
          <button type="button" id="unit-km-btn" class="toggle-btn" aria-pressed="false">km</button>
        </div>
      </div>
    </div>

    <div class="field">
      <label>Prefer stops near (optional)</label>
      <div class="amenity-checks">
        <label class="amenity-check"><input type="checkbox" id="amenity-restaurant" value="restaurant" /> 🍔 Food</label>
        <label class="amenity-check"><input type="checkbox" value="playground" /> 🧒 Playground</label>
        <label class="amenity-check"><input type="checkbox" value="restroom" /> 🚻 Restroom</label>
        <label class="amenity-check"><input type="checkbox" id="amenity-shop" value="shop" /> 🛒 Shop</label>
      </div>

      <!-- Shown only when "Food" above is checked: pick specific chains to
           narrow the search to, instead of any restaurant/cafe.
           Which chains are listed depends on the detected country. -->
      <div id="chain-picker" class="chain-picker" hidden>
        <span class="chain-picker-label">Specific chains (optional):</span>
        <div id="chain-checks" class="chain-checks"></div>
      </div>

      <!-- Shown only when "Shop" above is checked: same idea as the chain
           picker, but grouped into two tiers (a quick errand vs. somewhere
           worth a longer stop). -->
      <div id="shop-picker" class="chain-picker" hidden>
        <span class="chain-picker-label">Specific shops (optional):</span>
        <div class="chain-tier">
          <span class="chain-tier-label">Quick stop</span>
          <div id="shop-quickstop-checks" class="chain-checks"></div>
        </div>
        <div class="chain-tier">
          <span class="chain-tier-label">Bigger break</span>
          <div id="shop-biggerbreak-checks" class="chain-checks"></div>
        </div>
      </div>

      <div class="amenity-distance-row">
        <span>within</span>
        <input id="amenity-distance" type="number" min="50" max="3000" step="50" value="100" />
        <div class="unit-toggle">
          <button type="button" id="amenity-unit-m-btn" class="toggle-btn" aria-pressed="true">m</button>
          <button type="button" id="amenity-unit-ft-btn" class="toggle-btn" aria-pressed="false">ft</button>
        </div>
      </div>
    </div>

    <button type="submit" id="find-btn">Find Routes</button>
  </form>

  <!-- Status messages: "Loading...", errors, etc. -->
  <p id="status" role="status"></p>

  <!-- Shown after route lookup: 2-3 route options as clickable boxes,
       each showing drive time and distance. Pick one to see it on the map. -->
  <div id="route-picker" class="picker" hidden>
    <h2>Choose a route</h2>
    <div id="route-options" class="option-grid"></div>
  </div>

  <!-- Shown once a route is picked and you entered a car range: 2-3
       charging-plan strategies as clickable boxes for that route. -->
  <div id="plan-picker" class="picker" hidden>
    <h2>Choose a charging plan</h2>
    <div id="plan-options" class="option-grid"></div>
  </div>

  <!-- The written stop-by-stop detail for whichever plan box is selected. -->
  <div id="plan" class="plan" hidden>
    <h2>⚡ Charging plan</h2>
    <div id="plan-content"></div>
  </div>

  <!-- Shown once chargers are found: lets you switch what the pin colors mean,
       and explains what each color is. Hidden until there are results. -->
  <div id="legend" class="legend" hidden>
    <div class="legend-toggle">
      <span>Color pins by:</span>
      <button type="button" id="mode-speed-btn" class="toggle-btn" aria-pressed="true">Charging speed</button>
      <button type="button" id="mode-plug-btn" class="toggle-btn" aria-pressed="false">Plug type</button>
    </div>
    <div id="legend-items" class="legend-items"></div>
  </div>

  <!-- The map itself gets drawn inside this div by Leaflet -->
  <div id="map"></div>

  <!-- Leaflet's JavaScript library -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- The brand lists behind the "specific chains"/"specific shops" pickers, by country. -->
  <script src="brandLists.js?v=4"></script>
  <script src="app.js?v=18"></script>
</body>
</html>
